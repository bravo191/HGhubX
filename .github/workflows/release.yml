name: Release
run-name: "Release · ${{ inputs.tag != '' && inputs.tag || github.ref_name }}${{ inputs.platforms != '' && inputs.platforms != 'all' && format(' ({0})', inputs.platforms) || '' }}"

# 标准版打包与发布（CD）：推送 v* tag 或手动触发时先跑轻量前置门禁，再按平台编译并发布标准版 GitHub Release。
# 日常 CI 校验见 .github/workflows/ci.yml；TV 版独立发版见 .github/workflows/tv-release.yml。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "打包范围：all 标准版全平台，或指定单一平台"
        type: choice
        default: all
        options: [all, android-arm64, android, linux, windows, macos, ios]
      quick:
        description: "快速编译：thin LTO + 4 个 codegen 单元，快一倍（勾选时不发布 Release）"
        type: boolean
        default: true
      tag:
        description: "发版 tag（如 v2.2.6）：配合 platforms=all 且 quick=false 发布 Release；留空只出产物"
        type: string
        default: ""
      prerelease:
        description: "标记为 Pre-release（预发布，不出正式版）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.platforms || 'all' }}-${{ (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && github.run_id || 'quick' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}

env:
  CI: "true"

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: 校验版本号与发布说明
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
            V="${INPUT_TAG#v}"
          else
            TAG=""
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          node scripts/set-version.mjs "$V"
          node scripts/check-i18n.mjs
          node scripts/check-doc-links.mjs
          if [[ -n "$TAG" && ! -f "docs/release-notes/${TAG}.md" ]]; then
            echo "::notice::未找到 docs/release-notes/${TAG}.md，发布时将回退自动生成说明"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  ios:
    name: iOS (unsigned ipa)
    needs: [preflight]
    runs-on: macos-latest
    timeout-minutes: 60
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'ios'
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v7
      - name: 版本号对齐 tag
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.preflight.outputs.version }}"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: ios
      - uses: ./.github/actions/setup-ios-project
      - name: 构建并打包 ipa
        shell: bash
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: artifacts/*
          if-no-files-found: error

